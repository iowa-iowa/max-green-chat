# Production-конфигурация чата MAX. Устанавливается после выпуска сертификата.
server {
    listen 80;
    server_name max-chat.2-56-126-240.nip.io;
    root /var/www/max-green-chat/current;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name max-chat.2-56-126-240.nip.io;
    root /var/www/max-green-chat/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/max-chat.2-56-126-240.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max-chat.2-56-126-240.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.green-api.com https://*.api.green-api.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /index.html {
        expires -1;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
