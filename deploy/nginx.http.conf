# Первичная конфигурация: получение HTTPS-сертификата через webroot.
server {
    listen 80;
    server_name max-chat.2-56-126-240.nip.io;
    root /var/www/max-green-chat/current;
    index index.html;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
